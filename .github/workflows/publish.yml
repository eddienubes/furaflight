name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise (and Bun, pinned via mise.toml)
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Build (single-target local-dev artifact, dist/furaflight)
        run: bun run build

      - name: Generate platform package manifests
        run: bun run generate:platforms

      - name: Build all 8 platform binaries (cross-compiled from this runner)
        run: bun run build:platforms

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publishes all 8 @furaflight/mcp-<platform> packages first, then the
      # main @furaflight/mcp package — so every version its
      # optionalDependencies point at already exists by the time it's
      # published (see scripts/publish-platforms.ts).
      - name: Publish platform packages, then the main package
        run: bun run publish:platforms
